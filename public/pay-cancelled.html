<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payment cancelled</title>
<style>
  :root {
    --charcoal: #1F2421;
    --paper: #F4F2ED;
    --amber: #F2A93B;
    --teal: #3D5A50;
    --rust: #C1502E;
    --line: #D8D3C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", -apple-system, sans-serif;
    background: var(--paper);
    color: var(--charcoal);
    padding: 24px;
  }
  .box {
    background: #fff;
    border: 1.5px solid var(--charcoal);
    border-radius: 8px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0; color: #8A8578; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <h1>Payment cancelled</h1>
    <p>No payment was made. If this was a mistake, use the Pay now link in your invoice email again whenever you're ready.</p>
  </div>
</body>
</html>

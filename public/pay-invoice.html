<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pay invoice</title>
<style>
  :root {
    --charcoal: #1F2421;
    --paper: #F4F2ED;
    --amber: #F2A93B;
    --teal: #3D5A50;
    --rust: #C1502E;
    --line: #D8D3C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", -apple-system, sans-serif;
    background: var(--paper);
    color: var(--charcoal);
    padding: 24px;
  }
  .box {
    background: #fff;
    border: 1.5px solid var(--charcoal);
    border-radius: 8px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0; color: #8A8578; font-size: 14px; line-height: 1.5; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--teal);
    border-radius: 50%;
    margin: 20px auto 0;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--rust); font-size: 14px; margin-top: 16px; display: none; }
</style>
</head>
<body>
  <div class="box">
    <div id="loading-view">
      <h1>Taking you to secure checkout&hellip;</h1>
      <p>One moment while we set up your payment.</p>
      <div class="spinner"></div>
    </div>
    <div id="error-view" style="display:none;">
      <h1>Couldn't start payment</h1>
      <p id="error-message" class="error" style="display:block;"></p>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://site-clock-backend-production.up.railway.app";

    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get("id");

    function showError(message) {
      document.getElementById("loading-view").style.display = "none";
      document.getElementById("error-view").style.display = "block";
      document.getElementById("error-message").textContent = message;
    }

    if (!invoiceId) {
      showError("This payment link is missing some information. Please use the Pay now link from your invoice email.");
    } else {
      fetch(`${API_BASE_URL}/api/payments/invoices/${invoiceId}/checkout-session`, { method: "POST" })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Something went wrong.");
          window.location.href = data.url;
        })
        .catch((err) => showError(err.message));
    }
  </script>
</body>
</html>

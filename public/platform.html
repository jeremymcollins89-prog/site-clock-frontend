<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Coll Platform</title>

<link rel="manifest" href="/platform-manifest.json" />
<meta name="theme-color" content="#060708" />
<link rel="apple-touch-icon" href="/icons/platform-apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coll Platform" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* Command-center HUD theme -- flat, dark, precise. No gradients, no blur,
     no glow. The only recurring motif is the small corner-bracket frame
     (see .login-box / .card ::before/::after below) borrowed from
     viewfinder/targeting-reticle UI, plus a static technical grid behind
     everything instead of the old animated starfield.

     Repurposed var names kept so the inline styles the JS injects at
     runtime (var(--teal-deep), var(--line), var(--charcoal) on the exempt
     toggle button, and var(--rust-deep) on the delete button) still
     resolve to sensible colors under this palette -- only the values
     changed, not the variable names, so no JS edits were needed. */
  :root {
    --bg: #060708;
    --panel: #0d0f12;
    --panel-alt: #111318;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.22);
    --line: #aab3c0;
    --charcoal: #060708;
    --cyan: #3ad6ff;
    --amber: #ffb454;
    --teal-deep: #1fd8a8;
    --rust: #ff5568;
    --rust-deep: #e0334c;
    --text: #e7ebf0;
    --text-dim: #7a8290;
    --text-faint: #4a505c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: "Space Grotesk", "Segoe UI", -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }
  body {
    position: relative;
    overflow-x: hidden;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
  }
  /* One faint, static wash top-center -- reads as depth/atmosphere on a
     command console, not a nebula. No blur filter, no animation. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(58,214,255,0.05), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  /* A slow, low-opacity band of light sweeping top to bottom on an endless
     loop -- the one bit of ambient motion left in the scene, reading as
     "the system is scanning/online" rather than decoration for its own
     sake. Fixed + pointer-events:none so it never blocks a click. */
  .scan-sweep {
    position: fixed; left: 0; right: 0; top: -160px; height: 160px;
    background: linear-gradient(to bottom, transparent, rgba(58,214,255,0.05), transparent);
    pointer-events: none; z-index: 0;
    animation: scanSweep 9s linear infinite;
  }
  @keyframes scanSweep {
    0% { transform: translateY(0); }
    100% { transform: translateY(calc(100vh + 160px)); }
  }

  #login-screen, #app { position: relative; z-index: 1; }

  input, button { font-family: inherit; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 2px;
    font-size: 14px; margin-bottom: 12px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus {
    outline: none; border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 12px rgba(58,214,255,0.28);
    background: var(--panel);
  }
  button { cursor: pointer; }
  .btn-primary {
    width: 100%; color: var(--charcoal); border: none; border-radius: 2px; font-weight: 700;
    padding: 13px; font-size: 12.5px; margin-top: 6px;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--cyan);
    transition: background 0.15s ease, box-shadow 0.15s ease;
    font-family: "JetBrains Mono", monospace;
  }
  .btn-primary:hover { background: #7fe4ff; box-shadow: 0 0 18px rgba(58,214,255,0.4); }
  .btn-primary:active { background: var(--cyan); }

  .error {
    color: var(--rust); font-size: 12.5px; margin: 4px 0 10px; display: none;
    background: rgba(255,85,104,0.08); border: 1px solid rgba(255,85,104,0.3);
    border-radius: 2px; padding: 8px 10px;
    font-family: "JetBrains Mono", monospace;
  }

  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #login-screen.hidden { display: none; }

  .brand-mark {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 22px;
  }
  .brand-ring { width: 30px; height: 30px; flex-shrink: 0; }
  .brand-ring path { fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: square; }
  .brand-ring .scope {
    fill: none; stroke: rgba(58,214,255,0.5); stroke-width: 1; stroke-dasharray: 2 3;
    transform-origin: 16px 16px;
    animation: scopeSpin 6s linear infinite;
  }
  @keyframes scopeSpin { to { transform: rotate(360deg); } }
  .brand-ring .dot { fill: var(--cyan); filter: drop-shadow(0 0 3px var(--cyan)); }

  /* Angular, chamfered panel silhouette (cut top-left/bottom-right
     corners) instead of a plain rectangle -- the signature "console panel"
     shape. The border follows the cut automatically since clip-path clips
     the full border-box. The ::before/::after triangles sit exactly over
     each cut corner as a bright chamfer/bevel highlight, like light
     catching an angled edge. */
  .login-box, .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  }
  .login-box::before, .card::before {
    content: ""; position: absolute; top: 0; left: 0; width: 18px; height: 18px;
    background: linear-gradient(135deg, var(--cyan) 50%, transparent 51%);
    pointer-events: none;
  }
  .login-box::after, .card::after {
    content: ""; position: absolute; bottom: 0; right: 0; width: 18px; height: 18px;
    background: linear-gradient(135deg, transparent 49%, var(--cyan) 50%);
    pointer-events: none;
  }

  .login-box { padding: 36px 32px; width: 360px; max-width: 90vw; }
  .login-box h1 {
    font-size: 16px; margin: 0 0 4px; text-align: center;
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
  }
  .login-box p {
    color: var(--text-dim); font-size: 11px; margin: 0 0 26px; text-align: center;
    letter-spacing: 0.08em; text-transform: uppercase;
    font-family: "JetBrains Mono", monospace;
  }

  #app { display: none; max-width: 1140px; margin: 0 auto; padding: 28px 20px 60px; }
  #app.visible { display: block; }

  header.top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;
    gap: 14px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  header.top .title-group { display: flex; align-items: center; gap: 0; }
  /* LCARS-style "elbow": a rounded-pill color block carrying the title,
     leading into a short, thinner bar in the secondary accent -- the
     classic two-tone console-panel header shape. */
  header.top h1.lcars-chip {
    margin: 0; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
    background: var(--cyan); color: var(--charcoal);
    padding: 9px 22px 9px 18px;
    border-radius: 999px 3px 3px 999px;
  }
  .lcars-bar {
    display: inline-block; height: 4px; width: 64px; margin-left: 6px;
    background: var(--amber); border-radius: 2px; opacity: 0.85;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--teal-deep);
    box-shadow: 0 0 6px 1px rgba(31,216,168,0.6);
    animation: pulseDot 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .live-label {
    font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 7px;
  }
  .chrono { color: var(--cyan); letter-spacing: 0.04em; }

  .logout-btn {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 2px; padding: 9px 16px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    transition: border-color 0.15s ease, color 0.15s ease;
    font-family: "JetBrains Mono", monospace;
  }
  .logout-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  .stats-row {
    display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 22px;
    background: var(--border); border: 1px solid var(--border);
  }
  .stat-card {
    background: var(--panel);
    padding: 16px 18px; flex: 1; min-width: 165px;
    position: relative;
  }
  .stat-card::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--cyan);
  }
  .stat-card .label {
    font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em;
    font-family: "JetBrains Mono", monospace;
  }
  .stat-card .value {
    font-size: 21px; font-weight: 600; margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    color: var(--text);
  }

  .card { padding: 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-family: "JetBrains Mono", monospace; font-weight: 500;
  }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(58,214,255,0.045); }

  .badge {
    display: inline-block; font-size: 10px; padding: 4px 10px; border-radius: 2px;
    font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    font-family: "JetBrains Mono", monospace;
  }
  .badge-yes {
    background: rgba(31,216,168,0.1); color: var(--teal-deep);
    border: 1px solid rgba(31,216,168,0.35);
  }
  .badge-no {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .badge-dormant {
    background: rgba(224,51,76,0.1); color: #ff7d8f;
    border: 1px solid rgba(224,51,76,0.35);
  }
  .badge-fresh {
    background: rgba(31,216,168,0.1); color: var(--teal-deep);
    border: 1px solid rgba(31,216,168,0.35);
  }
  .badge-never {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .toggle-btn {
    border: none; border-radius: 2px; padding: 7px 14px; font-size: 10.5px; font-weight: 700;
    color: #fff; letter-spacing: 0.04em; text-transform: uppercase;
    font-family: "JetBrains Mono", monospace;
  }

  .search-input { max-width: 300px; margin-bottom: 16px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 2px; }
</style>
</head>
<body>

<div class="scan-sweep" aria-hidden="true"></div>

<div id="login-screen">
  <div class="login-box">
    <div class="brand-mark">
      <svg class="brand-ring" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10 V5 H9" />
        <path d="M23 5 H28 V10" />
        <path d="M28 22 V27 H23" />
        <path d="M9 27 H4 V22" />
        <circle class="scope" cx="16" cy="16" r="8" />
        <circle class="dot" cx="16" cy="16" r="2.2" />
      </svg>
      <h1 style="margin:0;">Coll Platform</h1>
    </div>
    <p>Mission control &middot; owner access only</p>
    <div id="login-error" class="error"></div>
    <input id="platform-email-input" type="text" placeholder="Email" />
    <input id="platform-password-input" type="password" placeholder="Password" />
    <button class="btn-primary" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="title-group">
      <h1 class="lcars-chip">All companies</h1>
      <span class="lcars-bar"></span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="live-label"><span class="status-dot"></span>Live <span id="chrono" class="chrono"></span></span>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <div class="stats-row" id="stats-row"></div>

  <div class="card">
    <input class="search-input" id="company-search" placeholder="Search companies..." oninput="renderCompanies()" />
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Owner email</th>
          <th>Signed up</th>
          <th>Employees</th>
          <th>Stripe connected</th>
          <th>Last activity</th>
          <th>Billing exempt</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="companies-body"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE_URL = location.origin.includes("localhost") ? "http://localhost:3000" : "https://site-clock-backend-production.up.railway.app";
const TOKEN_KEY = "platform-token";

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

async function apiFetch(path, { method = "GET", body } = {}) {
  const token = getToken();
  const res = await fetch(`${API_BASE_URL}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

let allCompanies = [];

// Company name and owner email are typed in by whoever signs up -- anyone,
// unauthenticated -- so they have to be escaped before landing in innerHTML
// below, or a malicious signup could run script in the platform operator's
// own logged-in session the next time this page is opened.
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function doLogin() {
  const email = document.getElementById("platform-email-input").value.trim();
  const password = document.getElementById("platform-password-input").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  if (!email || !password) {
    errEl.textContent = "Enter email and password.";
    errEl.style.display = "block";
    return;
  }
  try {
    const data = await apiFetch("/api/platform/login", { method: "POST", body: { email, password } });
    setToken(data.token);
    showApp();
  } catch (err) {
    errEl.textContent = err.message || "Login failed.";
    errEl.style.display = "block";
  }
}

function doLogout() {
  clearToken();
  document.getElementById("app").classList.remove("visible");
  document.getElementById("login-screen").classList.remove("hidden");
}

function showApp() {
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
  loadOverview();
  loadCompanies();
}

function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toISOString().slice(0, 10);
}

async function loadOverview() {
  const el = document.getElementById("stats-row");
  try {
    const o = await apiFetch("/api/platform/overview");
    el.innerHTML =
      statCard("Companies", o.total_companies) +
      statCard("Stripe connected", o.stripe_connected_count) +
      statCard("Dormant (30+ days)", o.dormant_count) +
      statCard("Total paid (all companies)", fmtMoney(o.total_paid)) +
      statCard("Your platform fee revenue", fmtMoney(o.total_platform_fees));
  } catch (err) {
    el.innerHTML = '<p style="color:#8A8578;">Couldn\'t load overview.</p>';
  }
}

function statCard(label, value) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
}

async function loadCompanies() {
  const body = document.getElementById("companies-body");
  body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">Loading...</td></tr>';
  try {
    allCompanies = await apiFetch("/api/platform/companies");
    renderCompanies();
  } catch (err) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">Couldn\'t load companies.</td></tr>';
  }
}

function renderCompanies() {
  const search = document.getElementById("company-search").value.trim().toLowerCase();
  const body = document.getElementById("companies-body");
  const rows = allCompanies.filter(function(c) {
    if (!search) return true;
    return (c.name || "").toLowerCase().includes(search) || (c.admin_email || "").toLowerCase().includes(search);
  });

  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">No companies match.</td></tr>';
    return;
  }

  body.innerHTML = rows.map(function(c) {
    const stripeBadge = c.stripe_connected
      ? '<span class="badge badge-yes">Connected</span>'
      : '<span class="badge badge-no">Not connected</span>';

    let activityBadge;
    if (c.last_activity == null) {
      activityBadge = '<span class="badge badge-never">Never used</span>';
    } else if (c.dormant_days >= 30) {
      activityBadge = '<span class="badge badge-dormant">' + c.dormant_days + ' days ago</span>';
    } else {
      activityBadge = '<span class="badge badge-fresh">' + fmtDate(c.last_activity) + '</span>';
    }

    const exemptBtn = c.billing_exempt
      ? '<button class="toggle-btn" style="background:var(--teal-deep);" onclick="toggleExempt(\'' + c.id + '\', false)">Exempt (click to unset)</button>'
      : '<button class="toggle-btn" style="background:var(--line); color:var(--charcoal);" onclick="toggleExempt(\'' + c.id + '\', true)">Not exempt (click to comp)</button>';

    return '<tr>' +
      '<td><strong>' + escapeHtml(c.name) + '</strong></td>' +
      '<td>' + escapeHtml(c.admin_email) + '</td>' +
      '<td>' + fmtDate(c.created_at) + '</td>' +
      '<td>' + c.employee_count + '</td>' +
      '<td>' + stripeBadge + '</td>' +
      '<td>' + activityBadge + '</td>' +
      '<td>' + exemptBtn + '</td>' +
      '<td><button class="toggle-btn" style="background:var(--rust-deep);" onclick="deleteCompany(\'' + c.id + '\')">Delete</button></td>' +
    '</tr>';
  }).join("");
}

async function toggleExempt(id, newValue) {
  try {
    await apiFetch(`/api/platform/companies/${id}`, { method: "PATCH", body: { billing_exempt: newValue } });
    await loadCompanies();
  } catch (err) {
    alert(err.message || "Couldn't update that company.");
  }
}

// Permanently deletes a company and everything under it. Asks three separate
// times, each more explicit than the last, before actually calling the
// DELETE route -- this is irreversible, so there's no "undo" button to fall
// back on if a click was a mistake.
async function deleteCompany(id) {
  const company = allCompanies.find(function(c) { return c.id === id; });
  const name = company ? company.name : "this company";

  if (!confirm('Delete "' + name + '"? This removes every customer, employee, job, invoice and quote under this account.')) return;
  if (!confirm('Are you sure? All of "' + name + '"\'s data will be gone for good -- there is no undo.')) return;
  if (!confirm('Last check: delete "' + name + '" permanently right now?')) return;

  try {
    await apiFetch(`/api/platform/companies/${id}`, { method: "DELETE" });
    await loadCompanies();
    await loadOverview();
  } catch (err) {
    alert(err.message || "Couldn't delete that company.");
  }
}

// A small ticking UTC readout next to the "Live" status dot -- purely a
// console-chronometer flourish, but a real, correct clock rather than a
// static label, so it's honest rather than just decorative.
function tickChrono() {
  const el = document.getElementById("chrono");
  if (!el) return;
  el.textContent = new Date().toISOString().slice(11, 19) + " UTC";
}
tickChrono();
setInterval(tickChrono, 1000);

if (getToken()) {
  showApp();
}

// Registers the shared service worker so this page (like admin.html) can be
// added to a phone's home screen and opened as a standalone app icon rather
// than a browser tab. No push subscription here -- that's registered by
// admin.html for company-level schedule alerts; this page only needs the
// installability + offline-shell piece of the same worker.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" });
}

</script>
</body>
</html>

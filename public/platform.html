<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Coll Platform</title>

<link rel="manifest" href="/platform-manifest.json" />
<meta name="theme-color" content="#060911" />
<link rel="apple-touch-icon" href="/icons/platform-apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coll Platform" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Repurposed names kept so the inline styles the JS injects at runtime
       (var(--teal-deep), var(--line), var(--charcoal) on the exempt toggle
       button, and var(--amber)/var(--amber-deep) on the primary button)
       still resolve to sensible colors under the new palette -- only the
       values changed, not the variable names, so no JS edits were needed. */
    --bg-deep: #05070d;
    --bg-navy: #0a0f1e;
    --panel: rgba(15, 21, 38, 0.66);
    --panel-solid: #0e1526;
    --panel-border: rgba(140, 170, 255, 0.14);
    --line: #c9d3e8;
    --charcoal: #0b0e1a;
    --cyan: #52e3ff;
    --cyan-deep: #17b4d9;
    --violet: #9c8bff;
    --violet-deep: #6a56f0;
    --gold: #f4c169;
    --amber: #f4b04c;
    --amber-deep: #db8a16;
    --teal-deep: #17e0c0;
    --rust: #ff6b6b;
    --rust-deep: #ff4d6d;
    --text: #e8ecf9;
    --text-dim: #8a93b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: "Space Grotesk", "Segoe UI", -apple-system, sans-serif;
    background: var(--bg-deep); color: var(--text);
  }
  body {
    position: relative;
    overflow-x: hidden;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 110px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #cfe0ff, transparent),
      radial-gradient(1px 1px at 210px 150px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 280px 40px, #fff, transparent),
      radial-gradient(1px 1px at 45px 180px, #cfe0ff, transparent),
      radial-gradient(1px 1px at 320px 190px, #fff, transparent);
    background-repeat: repeat;
    background-size: 340px 220px;
    background-color: var(--bg-deep);
    animation: driftStars 220s linear infinite;
  }
  @keyframes driftStars {
    from { background-position: 0 0; }
    to { background-position: -3400px 2200px; }
  }
  body::before {
    content: "";
    position: fixed;
    inset: -10% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(closest-side, rgba(108, 99, 255, 0.22), transparent 70%),
      radial-gradient(closest-side, rgba(82, 227, 255, 0.14), transparent 65%);
    background-position: 15% 10%, 80% 0%;
    background-repeat: no-repeat;
    pointer-events: none;
    z-index: 0;
    filter: blur(10px);
  }
  #login-screen, #app { position: relative; z-index: 1; }

  input, button { font-family: inherit; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    font-size: 15px; margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--panel-border);
    color: var(--text);
  }
  input::placeholder { color: var(--text-dim); }
  input:focus {
    outline: none; border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(82,227,255,0.18), 0 0 18px rgba(82,227,255,0.25);
    background: rgba(255,255,255,0.06);
  }
  button { cursor: pointer; }
  .btn-primary {
    width: 100%; color: #0b0e1a; border: none; border-radius: 12px; font-weight: 700;
    padding: 13px; font-size: 15px; margin-top: 6px;
    letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%);
    box-shadow: 0 6px 22px rgba(108, 99, 255, 0.4), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(108,99,255,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset; }
  .btn-primary:active { transform: translateY(0); }

  .error {
    color: var(--rust); font-size: 13px; margin: 4px 0 10px; display: none;
    background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.35);
    border-radius: 10px; padding: 8px 10px;
  }

  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #login-screen.hidden { display: none; }

  .brand-mark {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 18px;
  }
  .brand-ring {
    width: 34px; height: 34px; flex-shrink: 0;
  }
  .brand-ring circle { fill: none; stroke-width: 1.6; }
  .brand-ring .orbit { stroke: rgba(82,227,255,0.35); }
  .brand-ring .core { fill: url(#coreGlow); }
  .brand-ring .dot { fill: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }

  .login-box {
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 34px 30px; width: 360px; max-width: 90vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  .login-box h1 {
    font-size: 20px; margin: 0 0 4px; text-align: center;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .login-box p {
    color: var(--text-dim); font-size: 12.5px; margin: 0 0 22px; text-align: center;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  #app { display: none; max-width: 1140px; margin: 0 auto; padding: 28px 20px 60px; }
  #app.visible { display: block; }

  header.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 14px; flex-wrap: wrap; }
  header.top .title-group { display: flex; align-items: center; gap: 10px; }
  header.top h1 {
    font-size: 19px; margin: 0; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--teal-deep);
    box-shadow: 0 0 8px var(--teal-deep), 0 0 16px var(--teal-deep);
    animation: pulseDot 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-label {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--text-dim);
    letter-spacing: 0.12em; text-transform: uppercase; display: flex; align-items: center; gap: 6px;
  }

  .logout-btn {
    background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 9px 16px; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.03em; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.24); }

  .stats-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .stat-card {
    background: var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 16px 18px; flex: 1; min-width: 165px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    position: relative; overflow: hidden;
  }
  .stat-card::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    opacity: 0.8;
  }
  .stat-card .label {
    font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em;
    font-family: "JetBrains Mono", monospace;
  }
  .stat-card .value {
    font-size: 23px; font-weight: 700; margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    color: var(--text);
    text-shadow: 0 0 18px rgba(82,227,255,0.25);
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.06em; padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
    font-family: "JetBrains Mono", monospace; font-weight: 500;
  }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(82,227,255,0.045); }

  .badge {
    display: inline-block; font-size: 10.5px; padding: 5px 12px; border-radius: 20px;
    font-weight: 700; letter-spacing: 0.03em;
    font-family: "JetBrains Mono", monospace;
  }
  .badge-yes {
    background: rgba(23,224,192,0.14); color: var(--teal-deep);
    border: 1px solid rgba(23,224,192,0.4); box-shadow: 0 0 10px rgba(23,224,192,0.15);
  }
  .badge-no {
    background: rgba(255,255,255,0.05); color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .badge-dormant {
    background: rgba(255,77,109,0.14); color: var(--rust-deep);
    border: 1px solid rgba(255,77,109,0.4); box-shadow: 0 0 10px rgba(255,77,109,0.15);
  }
  .badge-fresh {
    background: rgba(23,224,192,0.14); color: var(--teal-deep);
    border: 1px solid rgba(23,224,192,0.4); box-shadow: 0 0 10px rgba(23,224,192,0.15);
  }
  .badge-never {
    background: rgba(255,255,255,0.05); color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12);
  }

  .toggle-btn {
    border: none; border-radius: 10px; padding: 7px 14px; font-size: 11.5px; font-weight: 700;
    color: #fff; letter-spacing: 0.02em;
    font-family: "JetBrains Mono", monospace;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  .search-input { max-width: 300px; margin-bottom: 16px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 20px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="brand-mark">
      <svg class="brand-ring" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#9c8bff" />
            <stop offset="100%" stop-color="#52e3ff" stop-opacity="0.2" />
          </radialGradient>
        </defs>
        <circle class="orbit" cx="20" cy="20" r="17" />
        <circle class="core" cx="20" cy="20" r="6" />
        <circle class="dot" cx="34" cy="20" r="2.2" />
      </svg>
      <h1 style="margin:0;">Coll Platform</h1>
    </div>
    <p>Mission control &middot; owner access only</p>
    <div id="login-error" class="error"></div>
    <input id="platform-email-input" type="text" placeholder="Email" />
    <input id="platform-password-input" type="password" placeholder="Password" />
    <button class="btn-primary" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="title-group">
      <h1>All Companies</h1>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="live-label"><span class="status-dot"></span>Live</span>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <div class="stats-row" id="stats-row"></div>

  <div class="card">
    <input class="search-input" id="company-search" placeholder="Search companies..." oninput="renderCompanies()" />
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Owner email</th>
          <th>Signed up</th>
          <th>Employees</th>
          <th>Stripe connected</th>
          <th>Last activity</th>
          <th>Billing exempt</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="companies-body"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE_URL = location.origin.includes("localhost") ? "http://localhost:3000" : "https://site-clock-backend-production.up.railway.app";
const TOKEN_KEY = "platform-token";

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

async function apiFetch(path, { method = "GET", body } = {}) {
  const token = getToken();
  const res = await fetch(`${API_BASE_URL}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

let allCompanies = [];

// Company name and owner email are typed in by whoever signs up -- anyone,
// unauthenticated -- so they have to be escaped before landing in innerHTML
// below, or a malicious signup could run script in the platform operator's
// own logged-in session the next time this page is opened.
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function doLogin() {
  const email = document.getElementById("platform-email-input").value.trim();
  const password = document.getElementById("platform-password-input").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  if (!email || !password) {
    errEl.textContent = "Enter email and password.";
    errEl.style.display = "block";
    return;
  }
  try {
    const data = await apiFetch("/api/platform/login", { method: "POST", body: { email, password } });
    setToken(data.token);
    showApp();
  } catch (err) {
    errEl.textContent = err.message || "Login failed.";
    errEl.style.display = "block";
  }
}

function doLogout() {
  clearToken();
  document.getElementById("app").classList.remove("visible");
  document.getElementById("login-screen").classList.remove("hidden");
}

function showApp() {
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
  loadOverview();
  loadCompanies();
}

function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toISOString().slice(0, 10);
}

async function loadOverview() {
  const el = document.getElementById("stats-row");
  try {
    const o = await apiFetch("/api/platform/overview");
    el.innerHTML =
      statCard("Companies", o.total_companies) +
      statCard("Stripe connected", o.stripe_connected_count) +
      statCard("Dormant (30+ days)", o.dormant_count) +
      statCard("Total paid (all companies)", fmtMoney(o.total_paid)) +
      statCard("Your platform fee revenue", fmtMoney(o.total_platform_fees));
  } catch (err) {
    el.innerHTML = '<p style="color:#8A8578;">Couldn\'t load overview.</p>';
  }
}

function statCard(label, value) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
}

async function loadCompanies() {
  const body = document.getElementById("companies-body");
  body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">Loading...</td></tr>';
  try {
    allCompanies = await apiFetch("/api/platform/companies");
    renderCompanies();
  } catch (err) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">Couldn\'t load companies.</td></tr>';
  }
}

function renderCompanies() {
  const search = document.getElementById("company-search").value.trim().toLowerCase();
  const body = document.getElementById("companies-body");
  const rows = allCompanies.filter(function(c) {
    if (!search) return true;
    return (c.name || "").toLowerCase().includes(search) || (c.admin_email || "").toLowerCase().includes(search);
  });

  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8A8578; padding:16px;">No companies match.</td></tr>';
    return;
  }

  body.innerHTML = rows.map(function(c) {
    const stripeBadge = c.stripe_connected
      ? '<span class="badge badge-yes">Connected</span>'
      : '<span class="badge badge-no">Not connected</span>';

    let activityBadge;
    if (c.last_activity == null) {
      activityBadge = '<span class="badge badge-never">Never used</span>';
    } else if (c.dormant_days >= 30) {
      activityBadge = '<span class="badge badge-dormant">' + c.dormant_days + ' days ago</span>';
    } else {
      activityBadge = '<span class="badge badge-fresh">' + fmtDate(c.last_activity) + '</span>';
    }

    const exemptBtn = c.billing_exempt
      ? '<button class="toggle-btn" style="background:var(--teal-deep);" onclick="toggleExempt(\'' + c.id + '\', false)">Exempt (click to unset)</button>'
      : '<button class="toggle-btn" style="background:var(--line); color:var(--charcoal);" onclick="toggleExempt(\'' + c.id + '\', true)">Not exempt (click to comp)</button>';

    return '<tr>' +
      '<td><strong>' + escapeHtml(c.name) + '</strong></td>' +
      '<td>' + escapeHtml(c.admin_email) + '</td>' +
      '<td>' + fmtDate(c.created_at) + '</td>' +
      '<td>' + c.employee_count + '</td>' +
      '<td>' + stripeBadge + '</td>' +
      '<td>' + activityBadge + '</td>' +
      '<td>' + exemptBtn + '</td>' +
      '<td><button class="toggle-btn" style="background:var(--rust-deep);" onclick="deleteCompany(\'' + c.id + '\')">Delete</button></td>' +
    '</tr>';
  }).join("");
}

async function toggleExempt(id, newValue) {
  try {
    await apiFetch(`/api/platform/companies/${id}`, { method: "PATCH", body: { billing_exempt: newValue } });
    await loadCompanies();
  } catch (err) {
    alert(err.message || "Couldn't update that company.");
  }
}

// Permanently deletes a company and everything under it. Asks three separate
// times, each more explicit than the last, before actually calling the
// DELETE route -- this is irreversible, so there's no "undo" button to fall
// back on if a click was a mistake.
async function deleteCompany(id) {
  const company = allCompanies.find(function(c) { return c.id === id; });
  const name = company ? company.name : "this company";

  if (!confirm('Delete "' + name + '"? This removes every customer, employee, job, invoice and quote under this account.')) return;
  if (!confirm('Are you sure? All of "' + name + '"\'s data will be gone for good -- there is no undo.')) return;
  if (!confirm('Last check: delete "' + name + '" permanently right now?')) return;

  try {
    await apiFetch(`/api/platform/companies/${id}`, { method: "DELETE" });
    await loadCompanies();
    await loadOverview();
  } catch (err) {
    alert(err.message || "Couldn't delete that company.");
  }
}

if (getToken()) {
  showApp();
}

// Registers the shared service worker so this page (like admin.html) can be
// added to a phone's home screen and opened as a standalone app icon rather
// than a browser tab. No push subscription here -- that's registered by
// admin.html for company-level schedule alerts; this page only needs the
// installability + offline-shell piece of the same worker.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" });
}
</script>
</body>
</html>

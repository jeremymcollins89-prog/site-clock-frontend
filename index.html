<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coll Timeclock</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F2421" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coll Timeclock" />

    <script>
      // Applied as early as possible (before React even mounts) so there's
      // no flash of Day mode before switching to a saved Night mode
      // preference. Per-device only (localStorage), not synced to the
      // account -- see setTheme()/getTheme() in App.jsx for the toggle UI.
      (function () {
        try {
          if (localStorage.getItem("coll-theme") === "night") {
            document.documentElement.setAttribute("data-theme", "night");
          }
        } catch (e) { /* localStorage unavailable -- just stay on Day mode */ }
      })();
    </script>

    <!-- Leaflet + OpenStreetMap tiles -- free, no API key -- used only for
         the "Today's route" stop-order preview map. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Getting a fresh deploy to actually reach an employee's phone has two
      // separate gaps, and both need closing:
      //
      // 1. The service worker itself already updates and takes over
      //    automatically (skipWaiting + clients.claim in service-worker.js),
      //    but registration.update() only checks the service-worker.js file
      //    for changes. Most deploys never touch that file -- only the
      //    React app's bundle changes (new content-hashed filename) -- so
      //    this alone won't catch a routine update.
      // 2. An already-open tab/installed app instance (very normal for a
      //    time clock someone opens several times a day and otherwise just
      //    backgrounds) keeps running whatever JS is already loaded in
      //    memory. Nothing about the service worker updating in the
      //    background forces THAT already-running page to reload -- only an
      //    actual navigation does, and a backgrounded-then-resumed PWA/TWA
      //    doesn't always trigger one.
      //
      // checkForAppUpdate() below closes gap 2 directly: it re-fetches
      // index.html (bypassing the cache) and compares the hashed bundle
      // filename it references against the one actually running on this
      // page right now. If they differ, a new version has been deployed
      // since this page loaded, so it reloads. Runs whenever the app comes
      // back to the foreground -- the most natural, lowest-risk moment,
      // since the person just switched back to the app and hasn't started
      // typing anything yet.
      let reloadedForUpdate = false;
      function reloadOnce() {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      }
      // Attribute order in a built <script type="module" ...> tag isn't
      // guaranteed (src before type is just as valid HTML as the reverse),
      // so this checks each <script> tag for type="module" and pulls its
      // src separately, rather than assuming one fixed attribute order.
      function extractModuleScriptSrc(html) {
        const scriptTags = html.match(/<script\b[^>]*>/gi) || [];
        for (const tag of scriptTags) {
          if (/type="module"/i.test(tag)) {
            const srcMatch = tag.match(/src="([^"]+)"/i);
            if (srcMatch) return srcMatch[1];
          }
        }
        return null;
      }
      async function checkForAppUpdate() {
        try {
          const res = await fetch("/index.html", { cache: "no-store" });
          if (!res.ok) return;
          const html = await res.text();
          const latestSrc = extractModuleScriptSrc(html);
          const currentScript = document.querySelector('script[type="module"]');
          const currentSrc = currentScript && currentScript.getAttribute("src");
          // Only meaningful once both sides are actual hashed build output
          // (in dev, both sides are the same unhashed /src/main.jsx and
          // this correctly finds no difference).
          if (latestSrc && currentSrc && latestSrc !== currentSrc) {
            reloadOnce();
          }
        } catch (e) {
          // Offline or the fetch failed -- just skip this check, there's
          // nothing actionable here and it'll try again next time the app
          // is foregrounded.
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") checkForAppUpdate();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // updateViaCache: "none" stops the browser from ever applying its
          // own HTTP caching to service-worker.js itself — without this,
          // an update to the service worker's own code (like the caching
          // strategy fixes we've shipped) could sit uninstalled on a
          // device for a long time before the browser notices it changed.
          navigator.serviceWorker
            .register("/service-worker.js", { updateViaCache: "none" })
            .then((registration) => {
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  registration.update().catch(() => {});
                }
              });
              // Belt-and-suspenders: if the service worker file itself ever
              // does change and a new one takes control, reload for that
              // too (same guard as checkForAppUpdate, so only one reload
              // ever happens no matter which check catches it first).
              navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
            })
            .catch(console.error);
        });
      }
    </script>
  </body>
</html>
